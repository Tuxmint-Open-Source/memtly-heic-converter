name: Feature request
description: Propose one focused, reviewable improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user outcome without posting private infrastructure details, credentials, raw logs, personal media, or unpublished security information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What user-visible problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe behavior and acceptance criteria rather than private deployment specifics.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and safety impact
      description: Note affected Memtly refs, browsers/devices, metadata, memory, licensing, rollback, or server allow-list behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety confirmation
      options:
        - label: This request contains no credentials, private endpoints or topology, access paths, raw logs, or personal media.
          required: true
