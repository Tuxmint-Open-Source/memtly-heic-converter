name: hadolint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hadolint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Verified hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test verified acquisition and Dockerfile inventory
        run: python3 tests/scripts/test-run-hadolint.py

      - name: Lint tracked Dockerfiles
        run: python3 scripts/run-hadolint.py
