name: Markdownlint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Verified Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts

      - name: Test tracked Markdown inventory and invocation
        run: node --test tests/scripts/test-run-markdownlint.mjs

      - name: Lint tracked Markdown files
        run: node scripts/run-markdownlint.mjs
