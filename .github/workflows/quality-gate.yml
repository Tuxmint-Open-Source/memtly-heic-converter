name: Quality gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Project quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run foundation and fixture checks
        run: ./scripts/test-foundation.sh

      - name: Run browser test contract
        run: npm run test:browser

      - name: Audit JavaScript dependencies
        run: npm audit

      - name: Verify public repository safety
        run: ./scripts/check-public-safety.py

      - name: Verify community intake files
        run: ./scripts/check-community-files.py

      - name: Verify repository security policy
        run: ./scripts/check-security-policy.py

      - name: Verify CodeQL workflow contract
        run: ./scripts/check-codeql-workflow.py

      - name: Test verified ShellCheck acquisition and inventory
        run: python3 tests/scripts/test-run-shellcheck.py

      - name: Verify ShellCheck workflow contract
        run: ./scripts/check-shellcheck-workflow.py

      - name: Test verified actionlint acquisition and inventory
        run: python3 tests/scripts/test-run-actionlint.py

      - name: Verify actionlint workflow contract
        run: ./scripts/check-actionlint-workflow.py

      - name: Test verified hadolint acquisition and inventory
        run: python3 tests/scripts/test-run-hadolint.py

      - name: Verify hadolint workflow contract
        run: ./scripts/check-hadolint-workflow.py

      - name: Verify Dependabot maintenance config
        run: ./scripts/check-dependabot-config.py

      - name: Verify immutable GitHub Action pins
        run: ./scripts/check-workflow-actions.py

      - name: Verify committed upstream baseline
        run: python3 scripts/check-upstream-drift.py --check

      - name: Verify exact-upstream patch application
        run: ./scripts/check-patch-apply.sh

      - name: Check commit whitespace
        shell: bash
        run: |
          set -euo pipefail
          git show --check --format= HEAD
